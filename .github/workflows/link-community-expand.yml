name: Link expandable community notes

on:
  push:
    paths:
      - '.github/workflows/link-community-expand.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link expandable note script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('community.html')
          s=p.read_text()
          script='<script src="community-expand.js?v=1"></script>'
          if script not in s:
              s=s.replace('</body>',script+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit script link
        run: |
          git config user.name 'AORC Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add community.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable expandable community notes'
          git push
