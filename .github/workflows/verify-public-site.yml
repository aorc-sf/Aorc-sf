name: Verify public AORC site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Publish site to Supabase Storage
        run: |
          PUBLISH="https://ieihdpufnjthooambooh.supabase.co/functions/v1/publish-aorc-site"
          curl -fsSL -X POST "$PUBLISH" -o /tmp/publish.json
          cat /tmp/publish.json
          grep -q '"ok":true' /tmp/publish.json
      - name: Verify public storage site
        run: |
          URL="https://ieihdpufnjthooambooh.supabase.co/storage/v1/object/public/aorc-public-site/index.html"
          curl -fsSL -D /tmp/headers "$URL" -o /tmp/site.html
          cat /tmp/headers
          grep -qi '^content-type: text/html' /tmp/headers
          grep -q 'American Ownership & Reparative Resource Center' /tmp/site.html
          grep -q 'Sign Petition' /tmp/site.html
          echo "PUBLIC_SITE_OK"
