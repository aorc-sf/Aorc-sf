name: Verify public AORC site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify public site
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.display.dev/v1/public/artifacts"
          CODE=$(curl -sSL --max-time 60 -X POST \
            -F "file=@index.html;type=text/html" \
            -F "name=American Ownership and Reparative Resource Center" \
            -o /tmp/response.json -w '%{http_code}' "$API")
          echo "PUBLISH_HTTP=$CODE"
          cat /tmp/response.json
          echo
          test "$CODE" = "200" -o "$CODE" = "201"
          URL=$(jq -r '.previewUrl // .url // empty' /tmp/response.json)
          test -n "$URL"
          echo "Candidate URL: $URL"
          curl -fsSL --max-time 60 -D /tmp/headers "$URL" -o /tmp/hosted.html
          cat /tmp/headers
          grep -qi '^content-type: text/html' /tmp/headers
          grep -q 'American Ownership & Reparative Resource Center' /tmp/hosted.html
          grep -q 'Sign Petition' /tmp/hosted.html
          grep -q 'https://ieihdpufnjthooambooh.supabase.co/functions/v1/sign-petition' /tmp/hosted.html
          if grep -qi '^content-security-policy:' /tmp/headers; then
            echo "CSP_PRESENT"
            grep -i '^content-security-policy:' /tmp/headers
          else
            echo "NO_CSP_HEADER"
          fi
          SRC=$(sha256sum index.html | awk '{print $1}')
          DST=$(sha256sum /tmp/hosted.html | awk '{print $1}')
          echo "SOURCE_SHA=$SRC"
          echo "HOSTED_SHA=$DST"
          [ "$SRC" = "$DST" ] && echo "EXACT_CONTENT_MATCH" || echo "CONTENT_MATCH_MARKERS_ONLY"
          echo "PUBLIC_SITE_URL=$URL"
          echo "$URL" > /tmp/public_site_url.txt
