name: Bump board v6 assets
on:
  push:
    paths:
      - '.github/workflows/bump-board-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump board assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('community.html')
          s=p.read_text()
          import re
          s=re.sub(r'community-board-v2\.css\?v=\d+','community-board-v2.css?v=6',s)
          s=re.sub(r'community-board-v2\.js\?v=\d+','community-board-v2.js?v=6',s)
          p.write_text(s)
          PY
      - name: Commit cache bump
        run: |
          git config user.name 'AORC Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add community.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load organized community board v6'
          git push
