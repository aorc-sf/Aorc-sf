name: Apply community board v2

on:
  push:
    paths:
      - '.github/workflows/apply-community-board-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link board v2 assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('community.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="community-board-v2.css?v=1">'
          js='<script src="community-board-v2.js?v=1"></script>'
          if css not in s:
              s=s.replace('</head>',css+'</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name 'AORC Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add community.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable scalable community board v2'
          git push

