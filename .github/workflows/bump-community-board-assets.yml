name: Bump community board assets

on:
  push:
    paths:
      - '.github/workflows/bump-community-board-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust cached board assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('community.html')
          s=p.read_text()
          s=re.sub(r'community-board-v2\.css\?v=\d+','community-board-v2.css?v=7',s)
          s=re.sub(r'community-board-v2\.js\?v=\d+','community-board-v2.js?v=7',s)
          s=re.sub(r'community-expand\.js\?v=\d+','community-expand.js?v=2',s)
          p.write_text(s)
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'AORC Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add community.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load scrollable notes and official source links'
          git push

# trigger v7
