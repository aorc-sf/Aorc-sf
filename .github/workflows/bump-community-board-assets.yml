name: Bump community board assets

on:
  push:
    paths:
      - '.github/workflows/bump-community-board-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust cached board assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('community.html')
          s=p.read_text()
          s=s.replace('community-board-v2.css?v=3','community-board-v2.css?v=4')
          s=s.replace('community-board-v2.js?v=3','community-board-v2.js?v=4')
          p.write_text(s)
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'AORC Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add community.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load corrected community board v4 assets'
          git push

# trigger v4
