name: Fix community render order

on:
  push:
    paths:
      - '.github/workflows/fix-community-render-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize board query and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('community.html')
          s=p.read_text()
          s=s.replace("order=is_pinned.desc,created_at.desc&limit=100","order=is_pinned.desc,created_at.desc,id.desc&limit=100")
          s=s.replace('community-board-v2.js?v=4','community-board-v2.js?v=6')
          s=s.replace('community-board-v2.js?v=3','community-board-v2.js?v=6')
          s=s.replace('community-board-v2.js?v=1','community-board-v2.js?v=6')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'AORC Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add community.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use deterministic board ordering and fresh render script'
          git push
