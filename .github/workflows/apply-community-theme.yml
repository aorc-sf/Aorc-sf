name: Apply community board theme

on:
  push:
    paths:
      - '.github/workflows/apply-community-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link community theme safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('community.html')
          s=p.read_text()
          link='<link rel="stylesheet" href="community-theme.css?v=1">'
          if link not in s:
              s=s.replace('</head>',link+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit theme link
        run: |
          git config user.name 'AORC Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add community.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply playful corkboard community theme'
          git push

