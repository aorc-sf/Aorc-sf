<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AORC Password Reset</title><style>body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#1A2433}.wrap{max-width:680px;margin:60px auto;padding:20px}.box{background:#fff;border:1px solid #C9D4E1;border-radius:16px;padding:24px}.brand{font-weight:850;color:#102A43;margin-bottom:20px}.brand span{color:#D9A441}h1{color:#102A43}label{display:block;font-weight:800;color:#102A43;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #C9D4E1;border-radius:10px;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:850;cursor:pointer}.primary{background:#102A43;color:#fff}.muted{background:#edf3f8;color:#102A43}.help{font-size:14px;color:#5B677A;margin-top:12px}.hidden{display:none!important}a{color:#102A43;font-weight:800}</style></head><body><div class="wrap"><div class="brand">American Ownership <span>Resource Center</span></div><div class="box"><h1>Reset your password</h1><div id="request"><p>Enter the email for your Community Board account. We’ll send a recovery link.</p><label>Email</label><input id="email" type="email" autocomplete="email"><div class="row"><button id="send" class="btn primary" type="button">Send reset email</button><a class="btn muted" href="community.html">Back to Community Board</a></div></div><div id="change" class="hidden"><p>Your recovery link is valid. Choose a new password.</p><label>New password</label><input id="password" type="password" minlength="8" autocomplete="new-password"><div class="row"><button id="save" class="btn primary" type="button">Save new password</button></div></div><div id="status" class="help">Ready.</div></div></div><script>const U='https://ieihdpufnjthooambooh.supabase.co',K='sb_publishable_SWoYgzabnzuUfUyiENhP7Q_hgnDiekW';const $=i=>document.getElementById(i);let token=null;function status(t){$('status').textContent=t}async function send(){const email=$('email').value.trim().toLowerCase();if(!email||!email.includes('@'))return status('Enter a valid email address.');$('send').disabled=true;status('Sending reset email…');try{const r=await fetch(U+'/auth/v1/recover',{method:'POST',headers:{apikey:K,'content-type':'application/json'},body:JSON.stringify({email,redirect_to:location.origin+location.pathname})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Unable to send reset email.');status('Reset email sent. Open the recovery link in that email on this device.')}catch(e){status(e.message)}finally{$('send').disabled=false}}async function init(){const h=new URLSearchParams(location.hash.replace(/^#/,''));if(h.get('type')!=='recovery'||!h.get('access_token'))return;token=h.get('access_token');$('request').classList.add('hidden');$('change').classList.remove('hidden');status('Recovery link accepted. Choose your new password.')}async function save(){const password=$('password').value;if(password.length<8)return status('Use at least 8 characters.');if(!token)return status('Open the recovery link from your email first.');$('save').disabled=true;status('Saving new password…');try{const r=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{apikey:K,Authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||'Unable to update password.');status('Password updated. Return to the Community Board and sign in with your new password.');history.replaceState(null,'',location.pathname);$('password').value=''}catch(e){status(e.message)}finally{$('save').disabled=false}}$('send').onclick=send;$('save').onclick=save;init();</script></body></html>
