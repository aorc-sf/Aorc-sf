<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AORC Password Reset</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1A2433}.wrap{max-width:680px;margin:60px auto;padding:20px}.box{background:#fff;border:1px solid #C9D4E1;border-radius:16px;padding:24px}.brand{font-weight:850;color:#102A43;margin-bottom:20px}.brand span{color:#D9A441}h1{color:#102A43}label{display:block;font-weight:800;color:#102A43;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #C9D4E1;border-radius:10px;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:850;cursor:pointer;text-decoration:none}.primary{background:#102A43;color:#fff}.muted{background:#edf3f8;color:#102A43}.help{font-size:14px;color:#5B677A;margin-top:12px}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="brand">American Ownership <span>Resource Center</span></div><div class="box"><h1>Reset your password</h1><div id="request"><p>Enter the email for your Community Board account. We’ll send a recovery link back to this live AORC page.</p><label>Email</label><input id="email" type="email"><div class="row"><button id="send" class="btn primary" type="button">Send reset email</button><a class="btn muted" href="community.html">Back to Community Board</a></div></div><div id="change" class="hidden"><p id="changeIntro">Your recovery link is valid. Choose a new password.</p><label>New password</label><input id="password" type="password" minlength="8"><div class="row"><button id="save" class="btn primary" type="button">Save new password</button></div></div><div id="status" class="help">Ready.</div></div></div><script>const U='https://ieihdpufnjthooambooh.supabase.co';const K=['sb','publishable','SWoYgzabnzuUfUyiENhP7Q_hgnDiekW'].join('_');const RESET='https://aorc-sf.github.io/Aorc-sf/reset.html';const SUPPORT=U+'/functions/v1/support-password-reset';const $=i=>document.getElementById(i);let token=null,supportToken=null;const status=t=>$('status').textContent=t;async function send(){const email=$('email').value.trim().toLowerCase();if(!email||!email.includes('@'))return status('Enter a valid email address.');$('send').disabled=true;status('Sending reset email…');try{const r=await fetch(U+'/auth/v1/recover?redirect_to='+encodeURIComponent(RESET),{method:'POST',headers:{apikey:K,'content-type':'application/json'},body:JSON.stringify({email})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Unable to send reset email.');status('Reset email sent. Use the newest recovery email.')}catch(e){status(e.message)}finally{$('send').disabled=false}}function init(){const h=new URLSearchParams(location.hash.slice(1));const q=new URLSearchParams(location.search);supportToken=q.get('support_token');token=h.get('access_token')||q.get('access_token');const type=h.get('type')||q.get('type');if(supportToken){$('request').classList.add('hidden');$('change').classList.remove('hidden');$('changeIntro').textContent='Choose a new password for your AORC Community Board account.';status('Secure reset link accepted.');return}if(type==='recovery'&&token){$('request').classList.add('hidden');$('change').classList.remove('hidden');status('Recovery link accepted. Choose your new password.')}}async function save(){const password=$('password').value;if(password.length<8)return status('Use at least 8 characters.');if(!token&&!supportToken)return status('Open a valid reset link first.');$('save').disabled=true;status('Saving new password…');try{let r;if(supportToken){r=await fetch(SUPPORT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:supportToken,password})})}else{r=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{apikey:K,Authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({password})})}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.msg||d.message||'Unable to update password.');status('Password updated successfully. Return to the Community Board and sign in.');history.replaceState(null,'',location.pathname);$('password').value='';supportToken=null;token=null}catch(e){status(e.message)}finally{$('save').disabled=false}}$('send').onclick=send;$('save').onclick=save;init();</script></body></html>
